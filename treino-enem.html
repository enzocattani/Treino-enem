<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treino Enem · Direito USP</title><meta name="theme-color" content="#1C2541"><link rel="icon" href="icon-treino-192.png"><link rel="manifest" href="treino.webmanifest"><link rel="apple-touch-icon" href="icon-treino-192.png">
<style>
:root{--ink:#1C2541;--gold:#C99A3B;--bg:#EDEFF3;--ok:#2E7D5B;--bad:#B23A2E;--mut:#5B6478}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 8px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #1c254122}
.mut{color:var(--mut);font-size:14px;margin:6px 0}
button,select,input,textarea{font:inherit;color:inherit}
.big{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:17px;margin:8px 0;cursor:pointer}
.chip{padding:8px 14px;border:1.5px solid var(--ink);border-radius:20px;background:#fff;margin:4px 4px 4px 0;cursor:pointer}
.alt{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:1.5px solid #D9DCE5;border-radius:10px;background:#fff;cursor:pointer}
.alt.ok{background:#e3f3ea;border-color:var(--ok)}.alt.bad{background:#f8e4e1;border-color:var(--bad)}
.txt img{max-width:100%}.txt{font-size:15px}
.bar{height:10px;background:#dde0e8;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
textarea,select,input[type=number],input[type=text]{width:100%;padding:10px;border:1.5px solid #D9DCE5;border-radius:10px;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--gold)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:#aab;padding:14px 0;font-size:14px}nav button.on{color:var(--gold);font-weight:700}
label{display:block;font-size:14px;color:var(--mut)}details{font-size:13px;color:var(--mut)}code{word-break:break-all}
.ck label{color:var(--ink);font-size:15px;padding:3px 0}
</style></head><body><main id="app"></main>
<nav><button data-a="tab" data-v="hoje">Hoje</button><button data-a="tab" data-v="red">Redação</button><button data-a="tab" data-v="painel">Painel</button><button data-a="tab" data-v="dados">Dados</button></nav>
<script>
const API='https://api.enem.dev/v1',KEY='enem-treino-v2',DAY=864e5,$=s=>document.querySelector(s);
const AREAS=[['linguagens','Linguagens',2],['ciencias-humanas','Humanas',2],['redacao','Redação',2],['matematica','Matemática',1],['ciencias-natureza','Natureza',1]];
const TEMAS=['Desafios para a valorização de comunidades e povos tradicionais no Brasil','Invisibilidade e registro civil: garantir direitos no Brasil','Manipulação do comportamento do usuário pelo controle de dados na internet','Democratização do acesso ao cinema no Brasil','Desafios para a formação educacional de surdos no Brasil','O estigma associado às doenças mentais na sociedade brasileira','Caminhos para combater a discriminação de gênero no mercado de trabalho','Os desafios da mobilidade urbana nas grandes cidades brasileiras'];
const CK=[['C1 · Norma culta',['Sem desvios graves de gramática','Concordância e regência corretas','Pontuação e vírgulas corretas','Ortografia e acentos corretos','Sem oralidade nem erros repetidos']],
['C2 · Tema e repertório',['Abordei o tema completo, sem tangenciar','Tese clara na introdução','Repertório sociocultural legitimado','Repertório pertinente ao tema','Dissertativo-argumentativo em 4 parágrafos']],
['C3 · Argumentação',['Ponto de vista claro do início ao fim','Argumentos desenvolvidos, não só citados','Texto planejado, sem contradição','Dados/fatos ligados à tese','Conclusão retoma a tese']],
['C4 · Coesão',['Conectivos no início dos parágrafos','Conectivos dentro dos parágrafos','Ligação entre os parágrafos','Pronomes/referências sem ambiguidade','Sem repetição de palavras']],
['C5 · Proposta',['Agente','Ação','Meio ou modo','Finalidade','Detalhamento (e respeita direitos humanos)']]];
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{log:[],err:{},essays:[],draft:{theme:TEMAS[0],text:''},goal:{target:800,minQ:15}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let BANK=[],BM={},T='hoje',Q={list:[],i:0,sel:null,ok:0,rev:new Set()},tl=3600,tmr=null;
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/!\[[^\]]*\]\(([^)\s"]+)\)/g,'<img src="$1" loading="lazy">').replace(/\n/g,'<br>');
const day=(d=new Date())=>d.toLocaleDateString('sv'),fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const dias=d=>Math.max(0,Math.ceil((new Date(d+'T13:00:00-03:00')-Date.now())/DAY));
/* banco local (IndexedDB) */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('enem-treino',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('q',m),r=f(t.objectStore('q'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const loadBank=async()=>{try{BANK=await tx('readonly',s=>s.getAll())||[]}catch(e){BANK=[]}BM=Object.fromEntries(BANK.map(q=>[q.id,q]))};
const putBank=l=>tx('readwrite',s=>l.forEach(x=>s.put(x)));
const norm=(q,y)=>({id:y+'-'+q.index+(q.language?'-'+q.language:''),src:'Enem '+y,area:q.discipline,ctx:q.context||'',body:q.alternativesIntroduction||q.body||'',alts:(q.alternatives||[]).map(a=>({l:a.letter,t:a.text||a.body||(a.file?'![]('+a.file+')':'')})),ans:q.correctAlternative});
/* lógica */
const acc=k=>{const l=S.log.filter(x=>x.a==k).slice(-60);return l.length?l.filter(x=>x.ok).length/l.length:.5};
const todayQ=()=>S.log.filter(x=>x.d==day()).length;
const dueIds=()=>Object.keys(S.err).filter(id=>S.err[id].due<=Date.now()&&BM[id]);
function streak(){const m=S.goal.minQ,c={};S.log.forEach(x=>c[x.d]=(c[x.d]||0)+1);const ds=Object.keys(c).sort();if(!ds.length)return 0;let s=0,g=0;for(let i=c[day()]>=m?0:1;i<90;i++){const d=day(new Date(Date.now()-i*DAY));if(d<ds[0])break;if(c[d]>=m)s++;else if(g<1+Math.floor(s/7))g++;else break}return s}
function nota(k){if(k=='redacao'){const e=S.essays.slice(-3);return e.length?Math.round(e.reduce((s,x)=>s+x.tot,0)/e.length):null}const l=S.log.filter(x=>x.a==k).slice(-100);return l.length<5?null:Math.round(320+l.filter(x=>x.ok).length/l.length*480)}
function sess(area){const seen=new Set(S.log.map(x=>x.id)),rev=dueIds().filter(id=>!area||BM[id].area==area).slice(0,10).map(id=>BM[id]),pool={},nw=[];
BANK.forEach(q=>{if(!seen.has(q.id)&&(!area||q.area==area))(pool[q.area]=pool[q.area]||[]).push(q)});
for(let n=S.goal.minQ;n>0;n--){const ks=Object.keys(pool).filter(k=>pool[k].length);if(!ks.length)break;
const wt=ks.map(k=>(AREAS.find(a=>a[0]==k)||[0,0,1])[2]*(1.3-acc(k)));let r=Math.random()*wt.reduce((a,b)=>a+b,0),j=0;while(r>wt[j]&&j<ks.length-1)r-=wt[j++];
const arr=pool[ks[j]];nw.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0])}
Q={list:[...rev,...nw],i:0,sel:null,ok:0,rev:new Set(rev.map(q=>q.id))}}
/* telas */
function vHoje(){const n=todayQ(),m=S.goal.minQ,l=S.essays[S.essays.length-1];
return `<div class=card><h2>Hoje</h2><p class=mut>Faltam <b>${dias('2026-11-08')}</b> dias para o 1º dia e <b>${dias('2026-11-15')}</b> para o 2º.</p>
<div class=bar><i style="width:${Math.min(100,n/m*100)}%"></i></div><p>${n}/${m} questões${n>=m?' ✓ meta batida':''} · sequência <b>${streak()}</b> dia(s)</p>
<button class=big data-a=go>Estudar hoje</button><p class=mut>${dueIds().length} revisão(ões) de erro pendente(s) · ${BANK.length} questões no banco</p></div>
<div class=card><h3>Treinar só uma área</h3>${AREAS.filter(a=>a[0]!='redacao').map(a=>`<button class=chip data-a=go data-v=${a[0]}>${a[1]}</button>`).join('')}</div>
${!l||Date.now()-l.t>2*DAY?`<div class=card><h3>Hora de uma redação</h3><p class=mut>Redação vale peso 2 e é o ganho mais rápido.</p><button class=chip data-a=tab data-v=red>Escrever agora</button></div>`:''}`}
function vQ(){const q=Q.list[Q.i];if(!q)return `<div class=card><h2>Sessão concluída</h2><p>${Q.ok}/${Q.list.length} acertos.</p><button class=big data-a=tab data-v=hoje>Voltar</button></div>`;const d=Q.sel!=null;
return `<div class=card><p class=mut>${Q.i+1}/${Q.list.length} · ${esc(q.src)}${Q.rev.has(q.id)?' · revisão':''}</p><div class=txt>${md(q.ctx)}</div><p><b>${md(q.body)}</b></p>
${q.alts.map(a=>`<button class="alt${d?(a.l==q.ans?' ok':a.l==Q.sel?' bad':''):''}" data-a=pick data-v=${a.l}><b>${a.l}</b> ${md(a.t)}</button>`).join('')}
${d?(Q.sel==q.ans?'<button class=big data-a=next>Próxima</button>':`<p><b>Por que errou?</b></p>${['Conteúdo','Interpretação','Distração'].map(c=>`<button class=chip data-a=cause data-v=${c}>${c}</button>`).join('')}`):''}</div>`}
function vRed(){const d=S.draft,l=S.essays.slice(-5).reverse();
return `<div class=card><h2>Redação</h2><select id=tema>${TEMAS.map(t=>`<option ${t==d.theme?'selected':''}>${esc(t)}</option>`).join('')}</select><button class=chip data-a=sort>Sortear tema</button>
<div class=row><b id=tm style="font-size:22px">${fmt(tl)}</b><button class=chip data-a=timer>Iniciar / pausar</button></div>
<textarea id=tx rows=14 placeholder="Escreva aqui (salva sozinho)…">${esc(d.text)}</textarea><p class=mut id=cnt></p>
<button class=big data-a=corrigir>Corrigir (autoavaliação)</button><div id=ck></div></div>
${l.map(e=>`<div class=card><b>${e.tot}</b>/1000 · ${new Date(e.t).toLocaleDateString('pt-BR')}<br><small>${e.c.join(' · ')} — ${esc(e.theme)}</small></div>`).join('')}`}
const spark=(v,mx)=>v.length<2?'':`<svg viewBox="0 0 200 50" width=100%><polyline fill=none stroke="#C99A3B" stroke-width=3 points="${v.map((y,i)=>(i/(v.length-1)*196+2)+','+(48-y/mx*44)).join(' ')}"/></svg>`;
function vPainel(){const rows=AREAS.map(([k,n,w])=>({k,n,w,v:nota(k)})),ok=rows.filter(r=>r.v!=null),W=ok.reduce((s,r)=>s+r.w,0),fin=ok.length?Math.round(ok.reduce((s,r)=>s+r.w*r.v,0)/W):null;
const col=v=>v>=550?'var(--ok)':v>=500?'var(--gold)':'var(--bad)';let best='';
if(ok.length){const b=ok.reduce((a,r)=>r.w*((r.k=='redacao'?1000:800)-r.v)>a.w*((a.k=='redacao'?1000:800)-a.v)?r:a);let extra='';
if(b.k=='redacao'){const e=S.essays.slice(-3),av=[0,1,2,3,4].map(i=>e.reduce((s,x)=>s+x.c[i],0)/e.length),mi=av.indexOf(Math.min(...av));extra=` Competência mais fraca: <b>${CK[mi][0]}</b>.`}
best=`<div class=card><h3>Maior ganho agora</h3><p>Foque em <b>${b.n}</b>: cada 100 pontos ali valem <b>${b.w*100/8}</b> na nota final.${extra}</p></div>`}
const cnt={};S.log.forEach(x=>cnt[x.d]=(cnt[x.d]||0)+1);const days=[...Array(28)].map((_,i)=>cnt[day(new Date(Date.now()-(27-i)*DAY))]||0),ca={};Object.values(S.err).forEach(e=>ca[e.cause||'sem causa']=(ca[e.cause||'sem causa']||0)+1);
return `<div class=card><h2>Painel</h2><p class=mut>Régua pessoal (não é a TRI). Pesos USP Direito: Red/Ling/Hum 2, Mat/Nat 1; mínimo 500 em todas.</p>
<p style="font-size:34px;margin:0"><b>${fin??'—'}</b> <span class=mut>nota final estimada${ok.length<5&&fin?' (parcial)':''} · meta ${S.goal.target}</span></p></div>
<div class=card>${rows.map(r=>`<div style="margin:10px 0"><div class=row><span><i class=dot style="background:${r.v==null?'#ccc':col(r.v)}"></i>${r.n} <small class=mut>peso ${r.w}</small></span><b>${r.v??'sem dados'}</b></div><div class=bar><i style="width:${(r.v||0)/10}%;background:${r.v==null?'#ccc':col(r.v)}"></i></div></div>`).join('')}<p class=mut>Verde ≥550 · amarelo 500–549 · vermelho &lt;500 (eliminatório)</p></div>
${best}<div class=card><h3>Redação ao longo do tempo</h3>${spark(S.essays.map(e=>e.tot),1000)||'<p class=mut>Salve 2 redações para ver o gráfico.</p>'}</div>
<div class=card><h3>Últimos 28 dias</h3><div class=heat>${days.map(n=>`<i style="opacity:${n?.25+.75*Math.min(1,n/S.goal.minQ):.08}" title=${n}></i>`).join('')}</div>
<p class=mut>Erros ativos por causa: ${Object.keys(ca).map(k=>k+' '+ca[k]).join(' · ')||'nenhum'}</p></div>`}
function vDados(){return `<div class=card><h3>Metas</h3><label>Nota alvo<input id=g1 type=number value=${S.goal.target}></label><label>Questões por dia (mínimo)<input id=g2 type=number value=${S.goal.minQ}></label></div>
<div class=card><h3>Banco de questões (${BANK.length})</h3><p class=mut>Baixe uma vez com internet; depois funciona offline.</p><input id=anos type=text value="2023,2022,2021,2020,2019"><button class=chip data-a=baixar>Baixar provas do Enem</button><p id=msg class=mut></p>
<label>Importar outras bancas (.json)<input type=file id=imp accept=.json></label>
<details><summary>Formato do JSON</summary><code>[{"id":"fuvest-2024-1","src":"Fuvest 2024","area":"ciencias-humanas","ctx":"texto","body":"enunciado","alts":[{"l":"A","t":"..."}],"ans":"B"}]</code><br>area: linguagens, ciencias-humanas, ciencias-natureza ou matematica</details></div>
<div class=card><h3>Backup</h3><button class=chip data-a=exp>Exportar progresso</button><label>Restaurar backup<input type=file id=bk accept=.json></label></div>`}
/* ações */
const rd=(el,f)=>el.onchange=()=>{const r=new FileReader();r.onload=()=>{try{f(JSON.parse(r.result))}catch(e){alert('Arquivo inválido')}};r.readAsText(el.files[0])};
const act={tab(v){T=v;render();scrollTo(0,0)},
go(a){if(!BANK.length){alert('Baixe as questões primeiro (aba Dados).');return act.tab('dados')}sess(a);if(!Q.list.length)return alert('Sem questões novas nem revisões. Baixe mais provas.');T='q';render();scrollTo(0,0)},
pick(l){if(Q.sel!=null)return;const q=Q.list[Q.i],ok=l==q.ans;Q.sel=l;if(ok)Q.ok++;S.log.push({d:day(),id:q.id,a:q.area,ok});const e=S.err[q.id];
if(ok){if(e){e.s++;if(e.s>=2)delete S.err[q.id];else e.due=Date.now()+7*DAY}}else S.err[q.id]={s:0,due:Date.now()+DAY,cause:''};save();render()},
next(){Q.i++;Q.sel=null;render();scrollTo(0,0)},cause(c){S.err[Q.list[Q.i].id].cause=c;save();act.next()},
sort(){S.draft.theme=TEMAS[Math.floor(Math.random()*TEMAS.length)];save();render()},
timer(){if(tmr){clearInterval(tmr);tmr=null}else tmr=setInterval(()=>{if(tl>0)tl--;const e=$('#tm');if(e)e.textContent=fmt(tl)},1000)},
corrigir(){$('#ck').innerHTML=CK.map((c,i)=>`<h3 style="margin-top:14px">${c[0]}</h3><div class=ck>${c[1].map(t=>`<label><input type=checkbox data-c=${i}> ${t}</label>`).join('')}</div>`).join('')+`<p style="font-size:20px"><b id=tot>0</b>/1000</p><button class=big data-a=salvar>Salvar redação</button><button class=chip data-a=copiar>Copiar texto + pedido p/ IA</button>`;$('#ck').onchange=()=>$('#tot').textContent=calc().tot},
salvar(){const t=$('#tx').value.trim();if(!t)return alert('Escreva o texto antes.');const r=calc();S.essays.push({t:Date.now(),theme:$('#tema').value,text:t,c:r.c,tot:r.tot});S.draft.text='';tl=3600;if(tmr)act.timer();save();render()},
copiar(){navigator.clipboard.writeText(`Corrija esta redação do Enem nas 5 competências (0 a 200 cada), aponte erros e sugira melhorias objetivas.\nTema: ${$('#tema').value}\n\n${$('#tx').value}`).then(()=>alert('Copiado! Cole em uma IA quando tiver internet.'))},
async baixar(){const ys=$('#anos').value.split(',').map(s=>s.trim()).filter(Boolean),m=$('#msg');let n=0;try{for(const y of ys){let off=0,more=true;while(more){m.textContent=`Baixando ${y}… ${n} questões`;const r=await fetch(`${API}/exams/${y}/questions?limit=50&offset=${off}`);if(!r.ok)throw new Error(y+': erro '+r.status);const d=await r.json(),L=(d.questions||[]).filter(q=>!q.language||q.language=='ingles').map(q=>norm(q,y));await putBank(L);n+=L.length;off+=50;more=!!(d.questions||[]).length&&(d.metadata&&d.metadata.hasMore!=null?d.metadata.hasMore:d.questions.length==50)}}m.textContent=`Pronto: ${n} questões salvas.`}catch(e){m.textContent='Falhou: '+e.message+' (já baixado fica salvo).'}await loadBank()},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='backup-treino-enem.json';a.click()}};
function calc(){const c=[0,0,0,0,0];document.querySelectorAll('#ck input:checked').forEach(i=>c[i.dataset.c]+=40);return{c,tot:c.reduce((a,b)=>a+b,0)}}
function render(){$('#app').innerHTML={hoje:vHoje,q:vQ,red:vRed,painel:vPainel,dados:vDados}[T]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(T=='q'?'hoje':T)));
if(T=='red'){const up=()=>{const t=$('#tx').value,w=t.trim()?t.trim().split(/\s+/).length:0;$('#cnt').textContent=`${w} palavras · ~${Math.ceil(t.length/75)} linhas (meta: 25–30)`};$('#tx').oninput=()=>{S.draft.text=$('#tx').value;save();up()};$('#tema').onchange=()=>{S.draft.theme=$('#tema').value;save()};up()}
if(T=='dados'){$('#g1').onchange=e=>{S.goal.target=+e.target.value||800;save()};$('#g2').onchange=e=>{S.goal.minQ=Math.max(1,+e.target.value||15);save()};
rd($('#imp'),async a=>{const L=(Array.isArray(a)?a:[]).map(q=>q.alternatives&&!q.alts?norm(q,q.year||'?'):q).filter(q=>q&&q.id&&q.area&&q.ans&&Array.isArray(q.alts)&&q.alts.length>1).map(q=>({src:'Importada',ctx:'',body:'',...q}));await putBank(L);await loadBank();alert(L.length+' questões importadas.');render()});
rd($('#bk'),o=>{if(!o.log||!o.err)throw 0;S=o;save();alert('Backup restaurado.');render()})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
loadBank().then(()=>{render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
